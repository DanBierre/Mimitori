<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
@page { size: 148mm 210mm; margin: 0 }
html, body { margin: 0; padding: 0 }
.page { width: 148mm; height: 210mm; position: relative; overflow: hidden; page-break-after: always; background: #fff; font-family: "Yu Gothic", "Noto Sans JP", sans-serif }
.page img { width: 100%; height: 100%; display: block }
.bubble { position: absolute; border: 0.6mm solid #222; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center }
.v { writing-mode: vertical-rl; font-size: 7mm; font-weight: 700; line-height: 1.2; margin: 0 }
</style></head><body>
<div class="page">
  <div class="bubble" style="left:96mm;top:22mm;width:30mm;height:80mm"><p class="v">本当に来たのか…</p></div>
  <div class="bubble" style="left:60mm;top:112mm;width:30mm;height:90mm"><p class="v">遅いよ、待ってたんだから</p></div>
</div>
<div class="page"><img src="page2.png" alt=""></div>
</body></html>
