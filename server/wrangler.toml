name = "mimitori-api"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [{ pattern = "api.mimitori.com", custom_domain = true }]
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "mimitori-api"
database_id = "30b519a6-0b35-4028-a279-c7646a76f987"

[[send_email]]
name = "EMAIL"

[vars]
MAIL_FROM = "no-reply@mimitori.com"
# TEST_MAILER = "1" logs sign-in codes instead of emailing them. For this PC: npx wrangler dev --var TEST_MAILER:1
